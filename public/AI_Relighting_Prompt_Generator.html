<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="RELIGHT LAB 多光源三维光位控制与 AI 重打光提示词生成器">
  <title>RELIGHT LAB · 多光源重打光控制台</title>
  <style>:root {
  --bg: #080b0c;
  --panel: rgba(17, 20, 21, 0.94);
  --panel-solid: #111415;
  --panel-2: #181c1e;
  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.17);
  --text: #f3f3ef;
  --muted: #92999a;
  --dim: #62696b;
  --accent: #d6ff4b;
  --accent-ink: #11140a;
  --font-sans: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
}

* { box-sizing: border-box; }
html { min-width: 320px; background: var(--bg); color-scheme: dark; }
body { margin: 0; min-width: 320px; min-height: 100svh; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; }
button { color: inherit; }

.studio-shell { position: relative; width: 100%; min-height: 100svh; overflow: hidden; background: var(--bg); }
.canvas-workspace { position: absolute; inset: 0; overflow: hidden; }
.studio-brand { position: absolute; top: 24px; left: 26px; z-index: 8; display: flex; align-items: center; gap: 11px; }
.studio-brand > span { display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid rgba(214, 255, 75, 0.52); border-radius: 9px; background: rgba(8, 11, 12, 0.74); color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: 0.08em; backdrop-filter: blur(14px); }
.studio-brand strong { color: rgba(243, 243, 239, 0.84); font-size: 11px; letter-spacing: 0.14em; }
.privacy-note { position: absolute; left: 26px; bottom: 24px; z-index: 8; display: flex; align-items: center; gap: 9px; color: var(--dim); font-size: 10px; letter-spacing: 0.04em; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px rgba(214, 255, 75, 0.58); }

.scene-switcher { position: absolute; top: 22px; left: 50%; z-index: 8; display: flex; gap: 3px; padding: 4px; border: 1px solid var(--line); border-radius: 11px; background: rgba(12, 15, 16, 0.82); transform: translateX(-65%); backdrop-filter: blur(16px); }
.scene-switcher button { min-width: 76px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); padding: 9px 11px; font-size: 10px; cursor: pointer; transition: 160ms ease; }
.scene-switcher button:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }
.scene-switcher button.active { background: var(--accent); color: var(--accent-ink); font-weight: 750; }

.light-field { position: absolute; inset: 0 450px 0 0; overflow: hidden; background: var(--bg); }
.light-field-toolbar { position: absolute; top: 82px; left: 26px; z-index: 7; display: flex; align-items: center; gap: 18px; padding: 12px 13px 12px 15px; border: 1px solid var(--line); border-radius: 12px; background: rgba(12, 15, 16, 0.76); backdrop-filter: blur(14px); }
.light-field-toolbar > div:first-child { display: grid; gap: 3px; }
.light-field-toolbar strong { font-size: 12px; font-weight: 720; }
.light-field-toolbar span { color: var(--muted); font-size: 9px; }
.view-switch { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: rgba(0, 0, 0, 0.25); }
.view-switch button { border: 0; border-radius: 6px; background: transparent; color: var(--muted); padding: 6px 10px; font-size: 9px; cursor: pointer; }
.view-switch button:hover { color: var(--text); }
.view-switch button.active { background: #303638; color: var(--text); }

.webgl-stage { position: absolute; inset: 0; overflow: hidden; isolation: isolate; background: #080b0c; }
.webgl-stage canvas { position: absolute; inset: 0; display: block; width: 100% !important; height: 100% !important; touch-action: none; outline: none; cursor: grab; }
.light-field.dragging canvas { cursor: grabbing; }
.webgl-stage canvas:focus-visible { box-shadow: inset 0 0 0 2px rgba(214, 255, 75, 0.58); }
.webgl-loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 10px; letter-spacing: 0.08em; }
.webgl-loading.unavailable { z-index: 3; padding: 30px; text-align: center; }
.webgl-loading.unavailable span { display: grid; gap: 8px; }
.webgl-loading.unavailable strong { color: var(--text); font-size: 12px; }
.webgl-loading.unavailable small { max-width: 320px; color: var(--muted); font-size: 9px; line-height: 1.6; letter-spacing: 0; }
.axis-label { position: absolute; z-index: 2; color: rgba(225, 231, 230, 0.45); font-size: 8px; letter-spacing: 0.12em; pointer-events: none; }
.axis-top { top: 11%; left: 50%; transform: translateX(-50%); }
.axis-left { top: 50%; left: 7%; transform: translateY(-50%); }
.axis-right { top: 50%; right: 7%; transform: translateY(-50%); }
.light-field-status { position: absolute; left: 26px; bottom: 54px; z-index: 7; display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 8px 9px 8px 13px; border: 1px solid var(--line); border-radius: 11px; background: rgba(12, 15, 16, 0.76); color: var(--muted); font-size: 9px; backdrop-filter: blur(14px); }
.light-field-status b { color: var(--accent); font-weight: 720; }
.field-actions { display: flex; gap: 5px; }
.field-actions button { border: 1px solid var(--line); border-radius: 7px; background: #1a1e1f; color: var(--muted); padding: 6px 8px; font-size: 9px; white-space: nowrap; cursor: pointer; }
.field-actions button:hover { border-color: var(--line-strong); color: var(--text); }

.floating-sidebar { position: absolute; top: 20px; right: 20px; bottom: 20px; z-index: 20; display: flex; width: min(410px, calc(100vw - 40px)); flex-direction: column; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.11); border-radius: 18px; background: var(--panel); box-shadow: 0 24px 70px rgba(0, 0, 0, 0.44); backdrop-filter: blur(22px); }
.sidebar-header { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 19px 20px 16px; }
.sidebar-header > div { display: grid; gap: 4px; }
.sidebar-header > div span { color: var(--dim); font-size: 8px; letter-spacing: 0.12em; }
.sidebar-header > div strong { font-size: 15px; letter-spacing: -0.01em; }
.light-count { padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; background: rgba(0, 0, 0, 0.2); color: var(--muted); font-size: 9px; font-variant-numeric: tabular-nums; }
.sidebar-tabs { flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin: 0 14px; padding: 4px; border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 11px; background: #0d1011; }
.sidebar-tabs button { border: 0; border-radius: 8px; background: transparent; color: var(--muted); padding: 9px; font-size: 10px; cursor: pointer; }
.sidebar-tabs button:hover { color: var(--text); }
.sidebar-tabs button.active { background: #2b3032; color: var(--text); font-weight: 720; }
.sidebar-scroll { min-height: 0; flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #353b3d transparent; }
.sidebar-section { padding: 20px; }
.section-heading { display: grid; gap: 4px; margin-bottom: 17px; }
.section-heading strong { font-size: 13px; }
.section-heading small { color: var(--dim); font-size: 9px; }
.prompt-heading { display: flex; align-items: flex-start; justify-content: space-between; }
.prompt-heading > div { display: grid; gap: 4px; }

.light-rig-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
.light-rig-heading > div { display: grid; gap: 4px; }
.light-rig-heading strong { font-size: 13px; }
.light-rig-heading small { color: var(--dim); font-size: 9px; }
.add-light-button { border: 1px solid rgba(214, 255, 75, 0.42); border-radius: 8px; background: rgba(214, 255, 75, 0.07); color: var(--accent); padding: 8px 10px; font-size: 9px; font-weight: 750; cursor: pointer; }
.add-light-button:hover { background: rgba(214, 255, 75, 0.12); }
.add-light-button:disabled { opacity: 0.35; cursor: not-allowed; }
.light-list { display: grid; gap: 7px; }
.light-list-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 7px; padding: 7px; border: 1px solid var(--line); border-radius: 10px; background: rgba(9, 12, 13, 0.55); transition: 160ms ease; }
.light-list-row.selected { border-color: rgba(214, 255, 75, 0.5); background: rgba(214, 255, 75, 0.05); }
.light-list-row.off { opacity: 0.55; }
.light-select-button { min-width: 0; display: flex; align-items: center; gap: 10px; border: 0; background: transparent; text-align: left; cursor: pointer; }
.light-select-button > i { flex: 0 0 auto; width: 13px; height: 13px; border: 2px solid rgba(255, 255, 255, 0.32); border-radius: 50%; background: var(--light-color); box-shadow: 0 0 12px color-mix(in srgb, var(--light-color) 62%, transparent); }
.light-select-button > span { min-width: 0; display: grid; gap: 3px; }
.light-select-button strong { overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.light-select-button small { color: var(--muted); font-size: 9px; }
.mini-toggle { position: relative; width: 30px; height: 18px; cursor: pointer; }
.mini-toggle input { position: absolute; opacity: 0; }
.mini-toggle i { display: block; width: 30px; height: 18px; border-radius: 999px; background: #373c3e; }
.mini-toggle i::after { position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: #e9ece9; content: ""; transition: 160ms ease; }
.mini-toggle input:checked + i { background: var(--accent); }
.mini-toggle input:checked + i::after { background: #11140a; transform: translateX(12px); }
.delete-light-button { border: 0; background: transparent; color: var(--dim); padding: 6px 4px; font-size: 8px; cursor: pointer; }
.delete-light-button:hover { color: #ff9a9a; }
.delete-light-button:disabled { opacity: 0.22; cursor: not-allowed; }

.rig-preset-panel { margin: 10px 0 14px; padding: 11px; border: 1px solid var(--line); border-radius: 11px; background: rgba(21, 25, 26, 0.72); }
.rig-preset-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.rig-preset-heading span { color: var(--text); font-size: 10px; font-weight: 720; }
.rig-preset-heading em { color: var(--dim); font-size: 8px; font-style: normal; }
.rig-preset-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.rig-preset-grid button { display: grid; gap: 3px; min-height: 46px; padding: 8px 9px; border: 1px solid var(--line); border-radius: 8px; background: #15191a; color: var(--muted); text-align: left; cursor: pointer; transition: 150ms ease; }
.rig-preset-grid button:hover { border-color: var(--line-strong); color: var(--text); }
.rig-preset-grid button.active { border-color: rgba(214, 255, 75, 0.58); background: rgba(214, 255, 75, 0.08); color: var(--accent); }
.rig-preset-grid strong { color: inherit; font-size: 9px; }
.rig-preset-grid small { color: var(--dim); font-size: 8px; }
.rig-preset-grid button.active small { color: rgba(214, 255, 75, 0.62); }

.selected-light-editor { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.selected-light-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 13px; }
.selected-light-heading > div { display: grid; gap: 3px; }
.selected-light-heading > div span { color: var(--accent); font-size: 8px; letter-spacing: 0.12em; }
.selected-light-heading > div strong { font-size: 14px; }
.light-name-field { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 10px; padding: 8px 0 15px; }
.light-name-field span { color: var(--muted); font-size: 10px; }
.light-name-field input { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #0d1011; color: var(--text); padding: 9px 10px; font-size: 11px; outline: none; }
.light-name-field input:focus { border-color: rgba(214, 255, 75, 0.52); box-shadow: 0 0 0 3px rgba(214, 255, 75, 0.06); }
.control-group { padding: 17px 0; border-top: 1px solid var(--line); }
.group-title { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 11px; }
.group-title span { font-size: 11px; font-weight: 720; }
.group-title em { color: var(--dim); font-size: 9px; font-style: normal; }
.option-grid { display: grid; gap: 6px; }
.direction-grid { grid-template-columns: repeat(4, 1fr); }
.light-grid { grid-template-columns: repeat(3, 1fr); }
.light-preset-grid { grid-template-columns: repeat(3, 1fr); }
.option-grid button { min-height: 35px; border: 1px solid var(--line); border-radius: 8px; background: #181c1e; color: var(--muted); font-size: 10px; cursor: pointer; transition: 150ms ease; }
.option-grid button:hover { border-color: var(--line-strong); color: var(--text); }
.option-grid button.active { border-color: rgba(214, 255, 75, 0.58); background: rgba(214, 255, 75, 0.08); color: var(--accent); }
.light-preset-grid button { display: grid; gap: 3px; min-height: 48px; padding: 8px 7px; text-align: left; }
.light-preset-grid button strong { color: inherit; font-size: 10px; font-weight: 720; }
.light-preset-grid button small { color: var(--dim); font-size: 8px; }
.light-preset-grid button.active small { color: rgba(214, 255, 75, 0.62); }
.range-row { display: grid; grid-template-columns: 72px 1fr 58px; align-items: center; gap: 11px; min-height: 58px; border-top: 1px solid var(--line); }
.range-label strong { font-size: 10px; }
.range-row output { justify-self: end; min-width: 54px; padding: 7px 6px; border: 1px solid var(--line); border-radius: 8px; background: #0d1011; color: var(--text); text-align: center; font-size: 10px; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; height: 3px; appearance: none; border-radius: 999px; background: #383e40; outline: none; }
input[type="range"]::-webkit-slider-thumb { width: 15px; height: 15px; appearance: none; border: 3px solid #25292a; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16); cursor: pointer; }
.angle-readout { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 6px; }
.angle-readout span { display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: #0d1011; color: var(--muted); font-size: 9px; }
.angle-readout b { color: var(--accent); font-size: 10px; font-variant-numeric: tabular-nums; }
.beam-range-group .range-row { margin-top: 6px; border-top: 0; }
.distance-group .range-row { min-height: 44px; border-top: 0; }

.switch-row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px; border: 1px solid var(--line); border-radius: 10px; background: #171b1c; cursor: pointer; }
.switch-row > span:first-child { display: grid; gap: 3px; font-size: 11px; }
.switch-row small { color: var(--dim); font-size: 9px; }
.switch-row input { position: absolute; opacity: 0; pointer-events: none; }
.switch-row i { position: relative; flex: 0 0 auto; width: 36px; height: 20px; border-radius: 999px; background: #363a3c; transition: 160ms ease; }
.switch-row i::after { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #f4f4ef; content: ""; transition: 160ms ease; }
.switch-row input:checked + i { background: var(--accent); }
.switch-row input:checked + i::after { background: #11140a; transform: translateX(16px); }
.switch-row input:focus-visible + i { outline: 3px solid rgba(214, 255, 75, 0.25); }
.switch-row.compact { padding: 0; border: 0; background: transparent; color: var(--muted); }
.switch-row.compact strong { color: var(--text); font-size: 9px; }
.switch-row.compact small { font-size: 8px; }
.snap-switch { margin: 0 0 10px; padding: 10px 11px; background: #0d1011; }
.snap-switch > span:first-child { gap: 2px; }
.snap-switch strong { font-size: 10px; }
.snap-switch small { font-size: 8px; }

.global-settings { padding-top: 20px; }
.global-settings > .switch-row { margin: 10px 0 19px; }
select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 9px; background: #0d1011; color: var(--text); outline: none; }
select { padding: 11px 12px; font-size: 10px; }
select:focus, textarea:focus { border-color: rgba(214, 255, 75, 0.55); box-shadow: 0 0 0 3px rgba(214, 255, 75, 0.07); }
.protect-card { display: flex; align-items: flex-start; gap: 11px; margin-top: 2px; padding: 13px; border: 1px solid rgba(214, 255, 75, 0.23); border-radius: 10px; background: rgba(214, 255, 75, 0.04); cursor: pointer; }
.protect-card input { width: 16px; height: 16px; margin: 1px 0 0; accent-color: var(--accent); }
.protect-card span { display: grid; gap: 4px; }
.protect-card strong { color: var(--accent); font-size: 10px; }
.protect-card small { color: var(--muted); font-size: 8px; line-height: 1.55; }
.reset-button { width: 100%; margin-top: 12px; padding: 11px; border: 1px solid var(--line); border-radius: 9px; background: transparent; color: var(--muted); font-size: 10px; cursor: pointer; }
.reset-button:hover { border-color: var(--line-strong); color: var(--text); }

.live-badge { border: 1px solid rgba(214, 255, 75, 0.28); border-radius: 999px; background: rgba(214, 255, 75, 0.055); color: var(--accent); padding: 6px 9px; font-size: 8px; letter-spacing: 0.08em; }
.prompt-summary { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 11px; }
.prompt-summary span { padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); color: var(--muted); font-size: 9px; }
.prompt-output { height: min(47svh, 480px); min-height: 280px; overflow: auto; border: 1px solid var(--line); border-radius: 11px; background: #0b0e0f; padding: 15px; scrollbar-width: thin; scrollbar-color: #3b4042 transparent; }
.prompt-output:focus { outline: 1px solid rgba(214, 255, 75, 0.45); }
.prompt-output pre { margin: 0; color: #c8ccca; font-family: var(--font-sans); font-size: 10.5px; line-height: 1.85; letter-spacing: 0.005em; white-space: pre-wrap; }
.note-block { margin-top: 14px; }
.note-block label { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; font-size: 10px; font-weight: 700; }
.note-block label span { color: var(--dim); font-weight: 400; }
textarea { min-height: 78px; resize: vertical; padding: 11px; font-size: 10px; line-height: 1.6; }
textarea::placeholder { color: #555b5d; }
.action-row { display: grid; grid-template-columns: 105px 1fr; gap: 8px; margin-top: 10px; }
.action-row button { height: 43px; border-radius: 9px; cursor: pointer; font-size: 10px; font-weight: 750; transition: 160ms ease; }
.secondary-button { border: 1px solid var(--line-strong); background: #222729; color: var(--text); }
.secondary-button:hover { background: #2b3032; }
.primary-button { border: 0; background: var(--accent); color: var(--accent-ink); }
.primary-button:hover { filter: brightness(1.05); transform: translateY(-1px); }

button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid rgba(214, 255, 75, 0.72); outline-offset: 2px; }

@media (max-width: 980px) {
  .light-field { right: 420px; }
  .scene-switcher { left: 44%; }
  .floating-sidebar { width: 380px; }
}

@media (max-width: 760px) {
  .studio-shell { min-height: 100svh; }
  .studio-brand { top: 14px; left: 14px; }
  .studio-brand strong { display: none; }
  .scene-switcher { top: 14px; right: 14px; left: 58px; justify-content: stretch; transform: none; overflow-x: auto; }
  .scene-switcher button { min-width: 74px; flex: 1 0 auto; padding: 8px; }
  .privacy-note { display: none; }
  .light-field { inset: 0 0 42svh; }
  .light-field-toolbar { top: 68px; right: 12px; left: 12px; justify-content: space-between; }
  .light-field-toolbar span { display: none; }
  .light-field-status { right: 12px; bottom: 12px; left: 12px; justify-content: space-between; }
  .light-field-status > span:nth-child(2) { display: none; }
  .floating-sidebar { top: auto; right: 10px; bottom: 10px; left: 10px; width: auto; height: 45svh; border-radius: 16px; }
  .sidebar-header { padding: 13px 15px 11px; }
  .sidebar-header > div { display: flex; align-items: center; gap: 8px; }
  .sidebar-header > div span { display: none; }
  .sidebar-header > div strong { font-size: 13px; }
  .sidebar-tabs { margin-inline: 10px; }
  .sidebar-section { padding: 16px; }
  .light-grid { grid-template-columns: repeat(3, 1fr); }
  .range-row { grid-template-columns: 58px 1fr 52px; gap: 9px; }
  .prompt-output { height: 210px; min-height: 210px; }
}

@media (max-width: 420px) {
  .light-field-toolbar { padding: 10px 11px; }
  .light-field-status > span { display: none; }
  .light-field-status { justify-content: center; }
  .direction-grid { grid-template-columns: repeat(4, 1fr); }
  .option-grid button { font-size: 9px; }
  .selected-light-heading { align-items: flex-start; }
  .action-row { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
